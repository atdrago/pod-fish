# The secret scan of KTD2. pre-commit scans the staged diff, and commit-msg scans the message.
#
# The custom rules below describe the shape of a value. This file holds no private value.

title = "pod-fish"

[extend]
useDefault = true

[[allowlists]]
description = "A placeholder value by its shape, never by a path, so .env.test stays scanned."
regexTarget = "match"
regexes = ['''(?:=|//|^)placeholder-''']

[[rules]]
id = "home-path"
description = "An absolute path in the home folder of a person."
regex = '''(?m)(?:^|[^A-Za-z0-9._-])(?:/Users/|/home/|[A-Za-z]:\\+Users\\+)[A-Za-z0-9._-]+'''

[[rules.allowlists]]
description = "A placeholder user name."
regexTarget = "match"
regexes = ['''(?:/|\\)(?:example|placeholder-[A-Za-z0-9._-]*)$''']

[[rules]]
id = "email-address"
description = "An email address. Only a domain reserved for examples can appear in this repo."
regex = '''(?i)[a-z0-9._%+-]+(?:@|%40)[a-z0-9-]+(?:\.[a-z0-9-]+)*\.[a-z]{2,}'''

[[rules.allowlists]]
description = "The domains that RFC 2606 reserves for documents and tests."
regexTarget = "match"
regexes = ['''(?i)(?:@|%40|\.)example\.(?:com|net|org)$''', '''(?i)\.(?:example|invalid|localhost|test)$''']

[[rules.allowlists]]
description = "The public contact address of the podping project, which the plan cites."
regexTarget = "match"
regexes = ['''^podping@podcastindex\.org$''']

[[rules]]
id = "content-folder-assignment"
description = "The absolute path of the content folder written as a value. It belongs in .env only."
regex = '''CONTENT_FOLDER[ \t]*[=:][ \t]*['"]?(?:/|~|[A-Za-z]:\\)[^\s'"]+'''

[[rules]]
id = "icecast-password-assignment"
description = "An Icecast password written as a value. It belongs in Fly secrets only."
regex = '''(?i)ICECAST_(?:SOURCE|ADMIN|RELAY)_PASSWORD[ \t]*[=:][ \t]*['"]?[^\s'"$<{.][^\s'"]{7,}'''

[[rules]]
id = "icecast-password-element"
description = "An Icecast password written into an XML config. Only the rendered file holds it."
regex = '''<(?:source|admin|relay)-password>[^<@$_]{8,}</'''

[[rules]]
id = "fly-toml-env-block"
description = "A fly.toml [env] block. Pass values with fly deploy --env, or set them as Fly secrets."
path = '''(?:^|/)fly\.toml$'''
regex = '''(?m)^[ \t]*\[env\]'''
